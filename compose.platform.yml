version: '3.3'
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: research_platform
      MYSQL_USER: research
      MYSQL_PASSWORD: local-research-only
    ports: ["127.0.0.1:53306:3306"]
    volumes: ["platform_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: research
      RABBITMQ_DEFAULT_PASS: local-research-only
    ports: ["127.0.0.1:55672:5672", "127.0.0.1:55673:15672"]
    volumes: ["platform_rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: research-local
      MINIO_ROOT_PASSWORD: local-research-only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["platform_objects:/data"]
volumes:
  platform_mysql:
  platform_rabbitmq:
  platform_objects:
